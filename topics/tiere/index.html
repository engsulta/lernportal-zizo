<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tierstimmen 🐄 – Zizo Lern-Spaß</title>
<link rel="stylesheet" href="../../shared/styles.css">
<link rel="manifest" href="../../manifest.webmanifest">
<meta name="theme-color" content="#89d4ff">
<link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Zizo">
</head>
<body>
<canvas id="confetti" style="display:none"></canvas>
<div id="app">
  <div class="topbar">
    <div class="brand"><span class="logo">🐄</span><span id="brandName">Tierstimmen</span></div>
    <div class="score"><span class="star">★</span><span id="totalStars">0</span></div>
    <button class="iconbtn" id="langBtn" title="Sprache / Language">🇩🇪</button>
    <button class="iconbtn" id="soundBtn" title="Ton an/aus">🔊</button>
  </div>
  <div id="screen"></div>
</div>
<div class="toast" id="toast"></div>

<script src="../../shared/kid.js"></script>
<script>
"use strict";
const { el, $, pick, shuffle, Store, pickGame, wireSoundButton, wireLangButton, clouds, T, Lang } = Kid;
document.documentElement.lang = Lang.get();
$("#totalStars").textContent = Store.total();
$("#brandName").textContent = T("Tierstimmen","Animal sounds");
wireLangButton($("#langBtn"));
wireSoundButton($("#soundBtn"));
clouds();

/* Tiere mit ihrem Laut, zweisprachig */
const ANIMALS=[
  {glyph:"🐄", sd:"Muh",        se:"moo"},
  {glyph:"🐶", sd:"Wau Wau",    se:"woof"},
  {glyph:"🐱", sd:"Miau",       se:"meow"},
  {glyph:"🦆", sd:"Quak",       se:"quack"},
  {glyph:"🐑", sd:"Mäh",        se:"baa"},
  {glyph:"🐓", sd:"Kikeriki",   se:"cock-a-doodle-doo"},
  {glyph:"🐝", sd:"Summ",       se:"buzz"},
  {glyph:"🦁", sd:"Brüll",      se:"roar"},
  {glyph:"🐴", sd:"Wieher",     se:"neigh"},
  {glyph:"🐷", sd:"Oink",       se:"oink"}
];

function buildRounds(){
  const chosen=shuffle(ANIMALS).slice(0,8);
  return chosen.map(target=>{
    const distract=shuffle(ANIMALS.filter(a=>a.glyph!==target.glyph)).slice(0,2);
    const options=[target,...distract].map(a=>({
      ok:a.glyph===target.glyph,
      build:node=>node.append(el("div",{class:"glyph"},a.glyph))
    }));
    return {
      say:T("Welches Tier macht "+target.sd+"? Tippe darauf!",
            "Which animal says "+target.se+"? Tap it!"),
      cols:3,
      prompt:host=>host.append(el("div",{class:"bigglyph"},"👂")),
      options
    };
  });
}

pickGame({
  id:"tiere", face:"🐄", title:T("Tierstimmen","Animal sounds"), backHref:"../../index.html",
  intro:T("Ich mache einen Tierlaut – tippe auf das richtige Tier!",
          "I'll make an animal sound – tap the right animal!"),
  introHtml:T("Wir üben <b>Tierstimmen</b>! Höre den Laut – tippe auf das passende Tier. 🐄",
              "Let's practice <b>animal sounds</b>! Listen to the sound – tap the matching animal. 🐄"),
  rounds: buildRounds()
});
</script>
</body>
</html>
