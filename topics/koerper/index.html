<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Körperteile 👃 – Zizo Lern-Spaß</title>
<link rel="stylesheet" href="../../shared/styles.css">
<link rel="manifest" href="../../manifest.webmanifest">
<meta name="theme-color" content="#89d4ff">
<link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Zizo">
</head>
<body>
<canvas id="confetti" style="display:none"></canvas>
<div id="app">
  <div class="topbar">
    <div class="brand"><span class="logo">👃</span><span id="brandName">Körperteile</span></div>
    <div class="score"><span class="star">★</span><span id="totalStars">0</span></div>
    <button class="iconbtn" id="langBtn" title="Sprache / Language">🇩🇪</button>
    <button class="iconbtn" id="soundBtn" title="Ton an/aus">🔊</button>
  </div>
  <div id="screen"></div>
</div>
<div class="toast" id="toast"></div>

<script src="../../shared/kid.js"></script>
<script>
"use strict";
const { el, $, pick, shuffle, Store, pickGame, wireSoundButton, wireLangButton, clouds, T, Lang } = Kid;
document.documentElement.lang = Lang.get();
$("#totalStars").textContent = Store.total();
$("#brandName").textContent = T("Körperteile","Body parts");
wireLangButton($("#langBtn"));
wireSoundButton($("#soundBtn"));
clouds();

/* Körperteile zweisprachig (Deutsch mit Artikel / Englisch) */
const BODY=[
  {de:"die Nase",   en:"the nose",   glyph:"👃"},
  {de:"das Ohr",    en:"the ear",    glyph:"👂"},
  {de:"das Auge",   en:"the eye",    glyph:"👁️"},
  {de:"der Mund",   en:"the mouth",  glyph:"👄"},
  {de:"die Hand",   en:"the hand",   glyph:"✋"},
  {de:"der Fuß",    en:"the foot",   glyph:"🦶"},
  {de:"der Zahn",   en:"the tooth",  glyph:"🦷"},
  {de:"die Zunge",  en:"the tongue", glyph:"👅"}
];

function buildRounds(){
  const chosen=shuffle(BODY).slice(0,8);
  return chosen.map(target=>{
    const distract=shuffle(BODY.filter(b=>b.glyph!==target.glyph)).slice(0,2);
    const options=[target,...distract].map(b=>({
      ok:b.glyph===target.glyph,
      build:node=>node.append(el("div",{class:"glyph"},b.glyph))
    }));
    return {
      say:T("Tippe auf "+target.de+"!", "Tap on "+target.en+"!"),
      cols:3,
      prompt:host=>host.append(el("div",{class:"bigglyph"},"👂")),
      options
    };
  });
}

pickGame({
  id:"koerper", face:"👃", title:T("Körperteile","Body parts"), backHref:"../../index.html",
  intro:T("Ich sage einen Körperteil – tippe auf das richtige Bild!",
          "I'll say a body part – tap the right picture!"),
  introHtml:T("Wir üben <b>Körperteile</b>! Ich sage einen Körperteil – tippe auf das passende Bild. 👃",
              "Let's practice <b>body parts</b>! I'll say a body part – tap the matching picture. 👃"),
  rounds: buildRounds()
});
</script>
</body>
</html>
