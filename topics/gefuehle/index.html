<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Gefühle 😊 – Zizo Lern-Spaß</title>
<link rel="stylesheet" href="../../shared/styles.css">
<link rel="manifest" href="../../manifest.webmanifest">
<meta name="theme-color" content="#89d4ff">
<link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Zizo">
</head>
<body>
<canvas id="confetti" style="display:none"></canvas>
<div id="app">
  <div class="topbar">
    <div class="brand"><span class="logo">😊</span><span id="brandName">Gefühle</span></div>
    <div class="score"><span class="star">★</span><span id="totalStars">0</span></div>
    <button class="iconbtn" id="langBtn" title="Sprache / Language">🇩🇪</button>
    <button class="iconbtn" id="soundBtn" title="Ton an/aus">🔊</button>
  </div>
  <div id="screen"></div>
</div>
<div class="toast" id="toast"></div>

<script src="../../shared/kid.js"></script>
<script>
"use strict";
const { el, $, pick, shuffle, Store, pickGame, wireSoundButton, wireLangButton, clouds, T, Lang } = Kid;
document.documentElement.lang = Lang.get();
$("#totalStars").textContent = Store.total();
$("#brandName").textContent = T("Gefühle","Feelings");
wireLangButton($("#langBtn"));
wireSoundButton($("#soundBtn"));
clouds();

/* Gefühle als Gesichter, zweisprachig */
const FEELINGS=[
  {glyph:"😃", de:"fröhlich",   en:"happy"},
  {glyph:"😢", de:"traurig",    en:"sad"},
  {glyph:"😠", de:"wütend",     en:"angry"},
  {glyph:"😴", de:"müde",       en:"tired"},
  {glyph:"😮", de:"überrascht", en:"surprised"},
  {glyph:"😨", de:"ängstlich",  en:"scared"},
  {glyph:"😍", de:"verliebt",   en:"in love"},
  {glyph:"😂", de:"lachend",    en:"laughing"}
];

function buildRounds(){
  const chosen=shuffle(FEELINGS).slice(0,8);
  return chosen.map(target=>{
    const distract=shuffle(FEELINGS.filter(f=>f.glyph!==target.glyph)).slice(0,2);
    const options=[target,...distract].map(f=>({
      ok:f.glyph===target.glyph,
      build:node=>node.append(el("div",{class:"glyph"},f.glyph))
    }));
    return {
      say:T("Welches Gesicht ist "+target.de+"? Tippe darauf!",
            "Which face is "+target.en+"? Tap it!"),
      cols:3,
      prompt:host=>host.append(el("div",{class:"bigglyph"},"👂")),
      options
    };
  });
}

pickGame({
  id:"gefuehle", face:"😊", title:T("Gefühle","Feelings"), backHref:"../../index.html",
  intro:T("Ich sage ein Gefühl – tippe auf das richtige Gesicht!",
          "I'll say a feeling – tap the right face!"),
  introHtml:T("Wir üben <b>Gefühle</b>! Ich sage ein Gefühl – tippe auf das passende Gesicht. 😊",
              "Let's practice <b>feelings</b>! I'll say a feeling – tap the matching face. 😊"),
  rounds: buildRounds()
});
</script>
</body>
</html>
