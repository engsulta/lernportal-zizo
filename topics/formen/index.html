<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Formen ⭐ – Zizo Lern-Spaß</title>
<link rel="stylesheet" href="../../shared/styles.css">
<link rel="manifest" href="../../manifest.webmanifest">
<meta name="theme-color" content="#89d4ff">
<link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Zizo">
</head>
<body>
<canvas id="confetti" style="display:none"></canvas>
<div id="app">
  <div class="topbar">
    <div class="brand"><span class="logo">⭐</span><span>Formen</span></div>
    <div class="score"><span class="star">★</span><span id="totalStars">0</span></div>
    <button class="iconbtn" id="soundBtn" title="Ton an/aus">🔊</button>
  </div>
  <div id="screen"></div>
</div>
<div class="toast" id="toast"></div>

<script src="../../shared/kid.js"></script>
<script>
"use strict";
const { el, $, pick, shuffle, Store, pickGame, wireSoundButton, clouds } = Kid;
$("#totalStars").textContent = Store.total();
wireSoundButton($("#soundBtn"));
clouds();

const COLORS=["#ff4d4d","#3aa0ff","#ffd23f","#3ad07f","#ff9f43","#a06bff","#ff6fc4"];

/* SVG-Formen: gleiche Form, aber Farbe/Position variieren – so lernt Zizo,
   Formen unabhaengig von der Farbe zu erkennen. */
const SHAPES={
  kreis:   c=>`<circle cx="50" cy="50" r="42" fill="${c}"/>`,
  quadrat: c=>`<rect x="10" y="10" width="80" height="80" rx="12" fill="${c}"/>`,
  dreieck: c=>`<polygon points="50,8 92,90 8,90" fill="${c}"/>`,
  stern:   c=>`<polygon points="50,5 61.8,38.2 96.9,38.2 68.5,59.5 79.4,92.7 50,71.5 20.6,92.7 31.5,59.5 3.1,38.2 38.2,38.2" fill="${c}"/>`,
  herz:    c=>`<path d="M50,88 C10,60 10,20 35,20 C48,20 50,35 50,38 C50,35 52,20 65,20 C90,20 90,60 50,88 Z" fill="${c}"/>`
};
const NAME={ kreis:"Kreis", quadrat:"Quadrat", dreieck:"Dreieck", stern:"Stern", herz:"Herz" };
const KINDS=Object.keys(SHAPES);

function shapeNode(kind,color,big){
  return el("div",{class:big?"bigshape":"shape",
    html:`<svg viewBox="0 0 100 100" width="100%" height="100%">${SHAPES[kind](color)}</svg>`});
}

function buildRounds(){
  const rounds=[];
  for(let k=0;k<8;k++){
    const target=pick(KINDS);
    const promptColor=pick(COLORS);
    // gleiche Form in ANDERER Farbe = richtige Antwort
    const matchColor=pick(COLORS.filter(c=>c!==promptColor));
    const others=shuffle(KINDS.filter(x=>x!==target)).slice(0,2);
    const opts=[
      { ok:true,  kind:target,   color:matchColor },
      { ok:false, kind:others[0],color:pick(COLORS) },
      { ok:false, kind:others[1],color:pick(COLORS) }
    ].map(o=>({ ok:o.ok, build:node=>node.append(shapeNode(o.kind,o.color)) }));
    rounds.push({
      say:"Das ist ein "+NAME[target]+". Finde die gleiche Form!",
      cols:3,
      prompt:host=>host.append(shapeNode(target,promptColor,true)),
      options:opts
    });
  }
  return rounds;
}

pickGame({
  id:"formen", face:"⭐", title:"Formen", backHref:"../../index.html",
  intro:"Wir suchen gleiche Formen! Schau oben, welche Form das ist, und finde die gleiche unten.",
  introHtml:"Wir üben <b>Formen</b>! Oben siehst du eine Form – finde unten die <b>gleiche</b> Form. ⭐",
  rounds: buildRounds()
});
</script>
</body>
</html>
