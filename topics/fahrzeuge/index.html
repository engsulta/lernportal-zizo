<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Fahrzeuge 🚗 – Zizo Lern-Spaß</title>
<link rel="stylesheet" href="../../shared/styles.css">
<link rel="manifest" href="../../manifest.webmanifest">
<meta name="theme-color" content="#89d4ff">
<link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Zizo">
</head>
<body>
<canvas id="confetti" style="display:none"></canvas>
<div id="app">
  <div class="topbar">
    <div class="brand"><span class="logo">🚗</span><span id="brandName">Fahrzeuge</span></div>
    <div class="score"><span class="star">★</span><span id="totalStars">0</span></div>
    <button class="iconbtn" id="langBtn" title="Sprache / Language">🇩🇪</button>
    <button class="iconbtn" id="soundBtn" title="Ton an/aus">🔊</button>
  </div>
  <div id="screen"></div>
</div>
<div class="toast" id="toast"></div>

<script src="../../shared/kid.js"></script>
<script>
"use strict";
const { el, $, pick, shuffle, Store, pickGame, wireSoundButton, wireLangButton, clouds, T, Lang } = Kid;
document.documentElement.lang = Lang.get();
$("#totalStars").textContent = Store.total();
$("#brandName").textContent = T("Fahrzeuge","Vehicles");
wireLangButton($("#langBtn"));
wireSoundButton($("#soundBtn"));
clouds();

/* Fahrzeuge zweisprachig (Deutsch mit Artikel / Englisch) */
const VEHICLES=[
  {de:"das Auto",           en:"the car",        glyph:"🚗"},
  {de:"der Bus",            en:"the bus",        glyph:"🚌"},
  {de:"das Flugzeug",       en:"the airplane",   glyph:"✈️"},
  {de:"das Schiff",         en:"the boat",       glyph:"🚢"},
  {de:"der Zug",            en:"the train",      glyph:"🚂"},
  {de:"das Feuerwehrauto",  en:"the fire truck", glyph:"🚒"},
  {de:"der Traktor",        en:"the tractor",    glyph:"🚜"},
  {de:"das Fahrrad",        en:"the bicycle",    glyph:"🚲"},
  {de:"der Hubschrauber",   en:"the helicopter", glyph:"🚁"},
  {de:"die Rakete",         en:"the rocket",     glyph:"🚀"}
];

function buildRounds(){
  const chosen=shuffle(VEHICLES).slice(0,8);
  return chosen.map(target=>{
    const distract=shuffle(VEHICLES.filter(v=>v.glyph!==target.glyph)).slice(0,2);
    const options=[target,...distract].map(v=>({
      ok:v.glyph===target.glyph,
      build:node=>node.append(el("div",{class:"glyph"},v.glyph))
    }));
    return {
      say:T("Wo ist "+target.de+"? Tippe darauf!", "Where is "+target.en+"? Tap it!"),
      cols:3,
      prompt:host=>host.append(el("div",{class:"bigglyph"},"👂")),
      options
    };
  });
}

pickGame({
  id:"fahrzeuge", face:"🚗", title:T("Fahrzeuge","Vehicles"), backHref:"../../index.html",
  intro:T("Ich sage ein Fahrzeug – tippe auf das richtige Bild!",
          "I'll say a vehicle – tap the right picture!"),
  introHtml:T("Wir üben <b>Fahrzeuge</b>! Ich sage ein Fahrzeug – tippe auf das passende Bild. 🚗",
              "Let's practice <b>vehicles</b>! I'll say a vehicle – tap the matching picture. 🚗"),
  rounds: buildRounds()
});
</script>
</body>
</html>
